name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: corepack enable
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run check
      - name: Create ZIP archive
        run: |
          cd dist
          zip ../turbowarp-extension.zip *.js
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.js
            turbowarp-extension.zip
